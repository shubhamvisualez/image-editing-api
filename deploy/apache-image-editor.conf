# The app directory lives inside public_html, so Apache treats
# /image-editor/ as a folder with no index and returns 403 until this
# proxy is enabled. Location wins over that filesystem mapping.
# ai_assistant.service is not involved.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo a2enconf image-editor
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

<Location "/image-editor/">
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass "http://127.0.0.1:8010/"
    ProxyPassReverse "http://127.0.0.1:8010/"
    Require all granted
</Location>

RedirectMatch 308 ^/image-editor$ /image-editor/
