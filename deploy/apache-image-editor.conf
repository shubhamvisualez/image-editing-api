# Image template tool — proxy snippet for the existing Apache vhost.
#
# The FastAPI app (ai_assistant.service) stays as it is. This process
# listens only on 127.0.0.1:8010. Paste the lines below into the SAME
# <VirtualHost> that already proxies the other app, and put them ABOVE
# any catch-all ProxyPass / rule so /image-editor/ is claimed first.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl reload apache2

# Do not set ProxyTimeout here — it applies to the whole vhost, including
# ai_assistant. Add "ProxyTimeout 120" only if image renders return 502.
ProxyPass        /image-editor/ http://127.0.0.1:8010/
ProxyPassReverse /image-editor/ http://127.0.0.1:8010/
RedirectMatch 308 ^/image-editor$ /image-editor/
